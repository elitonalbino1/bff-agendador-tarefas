spring.application.name=bff-agendador

# URLs com protocolo HTTP e variáveis de ambiente
usuario.url=${USUARIO_SERVICE_URL:http://localhost:8080}/usuario
agendador-tarefas.url=${TAREFAS_SERVICE_URL:http://localhost:8081}/tarefas

server.port=${SERVER_PORT:8083}

# JWT Secret (mesmo valor usado nos outros microsserviços)
jwt.secret=sua-chave-secreta-super-segura-que-deve-ser-bem-longa

# Configurações Feign (timeouts e logs)
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=5000
feign.client.config.default.loggerLevel=basic

# Configuração de logs (opcional mas recomendado)
logging.level.com.javanauta.bffagendador=INFO
logging.level.feign=DEBUG
